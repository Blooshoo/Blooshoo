services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blooshoo
      POSTGRES_USER: blooshoo
      # No default password: a hardcoded fallback here would ship a known
      # credential. Copy .env.example to .env.local and set a real one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.local (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blooshoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  blooshoo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-7777}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://blooshoo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.local (see .env.example)}@postgres:5432/blooshoo
      NODE_ENV: production
      # No default secret: the old ${AUTH_SECRET:-local-dev-secret-change-in-prod-123!}
      # fallback made session forgery trivial on any default deploy. Generate
      # one with `openssl rand -base64 32`.
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env.local (see .env.example)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:7777}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:7777}
      ORIGIN: ${ORIGIN:-http://localhost:7777}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      ALLOWED_DISCORD_IDS: ${ALLOWED_DISCORD_IDS:-}
      BUNNY_CDN_URL: ${BUNNY_CDN_URL:-}
      BUNNY_STORAGE_HOSTNAME: ${BUNNY_STORAGE_HOSTNAME:-}
      BUNNY_STORAGE_PASSWORD: ${BUNNY_STORAGE_PASSWORD:-}
      BUNNY_STORAGE_ZONE: ${BUNNY_STORAGE_ZONE:-}
    env_file:
      - path: .env.local
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
