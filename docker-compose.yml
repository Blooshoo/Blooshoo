services:
  blooshoo:
    build: .
    ports:
      - "${HOST_PORT:-7777}:3000"
    volumes:
      - blooshoo_data:/data
    environment:
      DATABASE_PATH: /data/blooshoo.db
      NODE_ENV: production
      # NextAuth — external URL other devices on your LAN will use
      AUTH_URL: ${AUTH_URL:-http://192.168.0.124:7777}
    env_file:
      - .env.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  blooshoo_data:
