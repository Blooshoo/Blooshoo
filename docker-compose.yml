services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blooshoo
      POSTGRES_USER: blooshoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blooshoo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blooshoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  blooshoo:
    build: .
    ports:
      - "${HOST_PORT:-7777}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://blooshoo:${POSTGRES_PASSWORD:-blooshoo}@postgres:5432/blooshoo
      NODE_ENV: production
      # better-auth — base URL for auth callbacks
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:7777}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:7777,https://blooshoo.com}
    env_file:
      - path: .env.local
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
